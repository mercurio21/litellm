# LiteLLM Proxy — единый пул провайдеров для фермы Hermes-профилей и Docker-детей.
# Admin UI: /ui. Форму логина отключает LITELLM_UI_AUTOLOGIN=true (ui_autologin.py), иначе admin / LITELLM_MASTER_KEY.
#
# model_list и credential_list хранятся в БД (store_model_in_db: true ниже) —
# правка моделей/ключей через Admin UI → LLM Credentials / Models + Endpoints,
# не здесь.
#
# Team BYOK / premium features are unlocked in this fork's source
# (litellm/proxy/auth/litellm_license.py: LicenseCheck.is_premium -> True).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true
  # Skills Hub: публичный индекс /.well-known/skills/index.json, чтобы агенты ставили скиллы через `hermes skills install`.
  public_skills_index: true
  callbacks:
    - anthropic_oauth_identity.proxy_handler_instance
    - ui_autologin.proxy_handler_instance  # no-op unless LITELLM_UI_AUTOLOGIN=true

environment_variables:
  MAX_STRING_LENGTH_PROMPT_IN_DB: "10000000"
  MAX_STRING_LENGTH_STDOUT_LOG: "10000000"
