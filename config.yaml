# LiteLLM Proxy — единый пул провайдеров для фермы Hermes-профилей и Docker-детей.
# Admin UI: /ui, логин admin, пароль — LITELLM_MASTER_KEY.
#
# model_list и credential_list хранятся в БД (store_model_in_db: true ниже) —
# правка моделей/ключей через Admin UI → LLM Credentials / Models + Endpoints,
# не здесь.
#
# Team BYOK / premium features are unlocked in this fork's source
# (litellm/proxy/auth/litellm_license.py: LicenseCheck.is_premium -> True).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  # Single-replica deployment on Railway with Serverless/sleep enabled
  # (https://docs.railway.com/deployments/serverless). Railway puts a service
  # to sleep only after 5-10 min with zero *outbound* traffic, and explicitly
  # lists "keeping active database connections open" as something that
  # prevents sleep. The defaults below poll the DB every 30s and run
  # background health checks on a timer — both generate outbound traffic on
  # a fixed schedule regardless of real requests, so the proxy would never
  # actually go idle. Stretched out here since we don't need fast multi-pod
  # convergence (only one replica) or a self-driven health loop.
  proxy_config_reload_interval_seconds: 86400  # once/day instead of every 30s
  background_health_checks: false              # health checks only run inline, on demand
  # Fork flag (proxy_server.py): skip the once-a-minute worker-heartbeat DB upsert
  # that would keep a scale-to-zero Postgres awake. Banner hidden via env
  # LITELLM_DISABLE_NO_REDIS_WARNING=true on Railway.
  disable_worker_heartbeat: true

litellm_settings:
  drop_params: true
  callbacks: anthropic_oauth_identity.proxy_handler_instance

environment_variables:
  MAX_STRING_LENGTH_PROMPT_IN_DB: "10000000"
  MAX_STRING_LENGTH_STDOUT_LOG: "10000000"
